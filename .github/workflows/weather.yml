name: AI Weather Viễn Thám

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: 

jobs:
  analyze-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt FFmpeg siêu nhẹ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install opencv-python-headless requests numpy google-genai

      - name: Chạy Trạm Khí Tượng AI
        env:
          RTSP_URL: ${{ secrets.RTSP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Lưu kết quả và Đẩy lên GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Cập nhật dữ liệu thời tiết mới nhất [skip ci]" || echo "Không có thay đổi dữ liệu"
          git push
